name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Validadores de convenciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar
        run: pip install pytest ruff
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Pytest
        run: pytest -q
